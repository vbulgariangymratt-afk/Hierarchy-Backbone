name: Build and Release macOS App

on:
  push:
    branches:
      - production

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Setup Signing Key
        run: |
          mkdir -p ~/.tauri
          echo "$PRIVATE_KEY" > ~/.tauri/backbone-signing.key
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(cat ~/.tauri/backbone-signing.key)" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" npm run tauri:build

      - name: Generate Updater Metadata and Prepare macOS Asset
        run: node scripts/update-metadata.js
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: Upload to Public Landing Page Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: vbulgariangymratt-afk/BH-minimal-webpage
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: latest
          files: |
            Backbone-macOS.tar.gz
            Backbone.dmg
          prerelease: false
          make_latest: true
          overwrite: true
