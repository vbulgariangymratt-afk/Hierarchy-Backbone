name: Build and Release macOS App

on:
  push:
    branches:
      - production

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Generate Updater Metadata and Prepare macOS Asset
        run: node scripts/update-metadata.js
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: Upload to Public Landing Page Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: vbulgariangymratt-afk/Backbone-s-minimal-webpage
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: latest
          files: Backbone-macOS.tar.gz
          prerelease: false
          make_latest: true
          overwrite: true
