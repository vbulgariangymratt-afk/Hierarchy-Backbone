name: Build and Release Windows App

on:
  push:
    branches:
      - production

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app for Windows
        run: npm run tauri:build

      - name: Prepare Windows Asset
        shell: bash
        run: |
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} ./Backbone-Setup.exe \;

      - name: Upload to Public Landing Page Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: vbulgariangymratt-afk/Backbone-s-minimal-webpage
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: latest
          files: Backbone-Setup.exe
          prerelease: false
          make_latest: true
